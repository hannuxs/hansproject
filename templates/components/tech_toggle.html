{# Saklar istilah teknis (MENYALA secara bawaan; pilihan pengunjung diingat). Parameter: id #}
<label class="switch tech-toggle glass" for="{{ id }}">
  <input type="checkbox" id="{{ id }}" checked>
  <span class="switch-ui" aria-hidden="true"></span>
  <span>Tampilkan istilah teknis</span>
</label>
