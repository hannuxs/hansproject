{% extends "sim/base.html" %}
{% block sim %}
<section class="akun-card glass akun-narrow" aria-labelledby="kk-title">
  <h2 id="kk-title">{% icon "users" %} {% if kk %}Ubah KK {{ kk.kepala_nama }}{% else %}Kartu keluarga baru{% endif %}</h2>
  <form method="post" class="akun-form" novalidate>
    {% csrf_token %}
    {% for field in form.visible_fields %}{{ field.as_field_group }}{% endfor %}
    <div class="akun-actions">
      <button class="btn" type="submit">{% icon "check" %}<span>Simpan</span></button>
      <a class="btn btn-ghost" href="{% if kk %}{% url 'sim:kk' w.kode kk.pk %}{% else %}{% url 'sim:warga' w.kode %}{% endif %}">Batal</a>
    </div>
  </form>
</section>
{% endblock %}
