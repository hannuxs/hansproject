{% extends "base.html" %}
{% block title %}{{ error_title }} | HANS Project{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<section class="section aurora error-page">
  <div class="pillars" aria-hidden="true"><i></i><i></i></div>

    <p class="error-code text-gradient">{{ error_code }}</p>

    <a class="btn" href="/">{% icon "home" %} Kembali ke beranda</a>
  </div>
</section>
{% endblock %}
